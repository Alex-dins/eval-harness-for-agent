[project]
name = "eval-harness"
version = "0.1.0"
description = "An eval harness for a tool-using agent"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "oleksandr.klants", email = "klancalex@gmail.com" }
]
dependencies = [
    "langfuse>=2.0",
    "openai>=1.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.scripts]
agent = "agent.__main__:main"
evals = "evals.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/evals"]
