name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      # Only the deterministic, offline unit tests run in CI.
      # The live eval suite (uv run evals) needs an API key and costs money,
      # so it is intentionally not run here.
      - name: Run tests
        run: uv run pytest -q
